services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Alma\Sylius\Controller\:
        resource: '../src/Controller/'
        public: true
        tags: ['controller.service_arguments']

    Alma\Sylius\Form\Type\:
        resource: '../src/Form/Type/'

    Alma\Sylius\Form\Extension\:
        resource: '../src/Form/Extension/'

    Alma\Sylius\Twig\:
        resource: '../src/Twig/'

    Alma\Sylius\Checkout\FeePlanGrouper: ~

    Alma\Sylius\InPage\InPageSettingsProvider: ~

    Alma\Sylius\InPage\OrderAlmaPaymentsProvider: ~

    Alma\Sylius\Checkout\GroupDisplayTextsResolver: ~

    Alma\Sylius\Exclusion\:
        resource: '../src/Exclusion/'

    Alma\Sylius\Form\Extension\AlmaGatewayConfigurationTypeExtension:
        arguments:
            $taxonsToCodesTransformer: '@sylius.form.type.data_transformer.taxons_to_codes'

    Alma\Sylius\ProductWidget\:
        resource: '../src/ProductWidget/'

    Alma\Sylius\CartWidget\AlmaCartWidgetConfigProvider:
        arguments:
            $cartContext: '@sylius.context.cart'

    Alma\Sylius\Widget\:
        resource: '../src/Widget/'

    Alma\Sylius\Api\:
        resource: '../src/Api/'

    Alma\Sylius\Api\MerchantEndpointFactoryInterface: '@Alma\Sylius\Api\MerchantEndpointFactory'

    Alma\Sylius\Api\EligibilityEndpointFactoryInterface: '@Alma\Sylius\Api\EligibilityEndpointFactory'

    Alma\Sylius\Api\PaymentEndpointFactoryInterface: '@Alma\Sylius\Api\PaymentEndpointFactory'

    Alma\Sylius\Api\OrderEndpointFactoryInterface: '@Alma\Sylius\Api\OrderEndpointFactory'

    Alma\Sylius\Api\ConfigurationEndpointFactoryInterface: '@Alma\Sylius\Api\ConfigurationEndpointFactory'

    Alma\Sylius\Payment\:
        resource: '../src/Payment/'

    # Payum gateway factory builder for the `alma` factory. Without this,
    # Payum's registry doesn't know how to build a gateway with name `alma`
    # and throws "Gateway 'almafr' does not exist." at place-order time.
    alma_sylius.payum.gateway_factory_builder:
        class: Payum\Core\Bridge\Symfony\Builder\GatewayFactoryBuilder
        arguments:
            - Alma\Sylius\Payment\AlmaPayumGatewayFactory
        tags:
            - { name: payum.gateway_factory_builder, factory: alma }

    Alma\Sylius\Payment\Action\AlmaCaptureAction:
        public: true
        tags:
            - { name: payum.action, factory: alma, alias: alma_sylius.capture }

    # Sylius 2 PaymentRequest command provider for the `alma` gateway factory.
    # Mirrors the offline pattern : base ActionsCommandProvider tagged for the
    # factory, decorated by PayumActionsCommandProvider which routes capture
    # to a Payum CapturePaymentRequest message → TokenPaymentRequestHandler
    # → our AlmaCaptureAction.
    alma_sylius.command_provider.payment_request.alma:
        class: Sylius\Bundle\PaymentBundle\CommandProvider\ActionsCommandProvider
        arguments:
            - !tagged_locator
                tag: alma_sylius.command_provider.payment_request.alma
                index_by: action
        tags:
            # `gateway_factory` (underscore) — Symfony XML normalises hyphens to
            # underscores when reading the offline registration, but YAML keys
            # are taken as-is. The locator's index-by is `gateway_factory`.
            - { name: sylius.payment_request.command_provider, gateway_factory: alma }

    alma_sylius.command_provider.payment_request.alma.payum:
        class: Sylius\Bundle\PayumBundle\PaymentRequest\CommandProvider\PayumActionsCommandProvider
        decorates: alma_sylius.command_provider.payment_request.alma
        arguments:
            - '@.inner'
            - !tagged_locator
                tag: alma_sylius.command_provider.payment_request.alma.payum
                index_by: action

    alma_sylius.command_provider.payment_request.alma.payum.capture:
        class: Sylius\Bundle\PayumBundle\PaymentRequest\CommandProvider\CaptureCommandProvider
        tags:
            - { name: alma_sylius.command_provider.payment_request.alma.payum, action: capture }

    Alma\Sylius\Resolver\:
        resource: '../src/Resolver/'

    Alma\Sylius\Resolver\AlmaStorefrontVisibility:
        arguments:
            $channelContext: '@sylius.context.channel'

    Alma\Sylius\Resolver\AlmaPaymentMethodResolver:
        arguments:
            $paymentMethodRepository: '@sylius.repository.payment_method'

    Alma\Sylius\Resolver\AlmaEligibilityPaymentMethodsResolver:
        decorates: sylius.resolver.payment_methods
        arguments:
            $decorated: '@.inner'

    Alma\Sylius\Eligibility\:
        resource: '../src/Eligibility/'

    Alma\Sylius\Cache\:
        resource: '../src/Cache/'

    Alma\Sylius\Form\Type\AlmaGatewayConfigurationType:
        tags:
            - { name: sylius.gateway_configuration_type, type: alma, label: alma_sylius.gateway.label }

    Alma\Sylius\Repository\AlmaPaymentReferenceRepository:
        tags: [doctrine.repository_service]

    Alma\Sylius\Security\ApiKeyCipher:
        arguments:
            $appSecret: '%kernel.secret%'

    Alma\Sylius\Security\BackOfficeUserDetector:
        arguments:
            $firewallMap: '@security.firewall.map'
            $adminUserRepository: '@sylius.repository.admin_user'
            $adminFirewallContext: '%alma_sylius.admin_firewall_context%'

    Alma\Sylius\EventListener\AlmaGatewayConfigCryptoListener:
        tags:
            - { name: doctrine.event_listener, event: postLoad }
            - { name: doctrine.event_listener, event: prePersist }
            - { name: doctrine.event_listener, event: preUpdate }
            - { name: doctrine.event_listener, event: postPersist }
            - { name: doctrine.event_listener, event: postUpdate }

    Alma\Sylius\EventListener\BackOfficeUserPrivateResponseListener:
        tags:
            - { name: kernel.event_listener, event: kernel.response }

    Alma\Sylius\EventListener\AlmaPaymentRefundListener:
        tags:
            - { name: kernel.event_listener, event: 'workflow.sylius_payment.transition.refund' }

    # After Sylius' own listener (priority 100), which gives the order a new payment.
    Alma\Sylius\EventListener\AlmaPaidAttemptCompletionListener:
        tags:
            - { name: kernel.event_listener, event: 'workflow.sylius_payment.completed.fail', priority: 0 }
            - { name: kernel.event_listener, event: 'workflow.sylius_payment.completed.cancel', priority: 0 }

    Alma\Sylius\OrderInformation\:
        resource: '../src/OrderInformation/'

    Alma\Sylius\Dispatch\AfterCommitDispatcher:
        tags:
            - { name: doctrine.event_listener, event: postFlush }
            - { name: kernel.event_listener, event: kernel.terminate, method: dispatch }
            - { name: kernel.event_listener, event: console.terminate, method: dispatch }
            # Before Doctrine's listener (priority 0), which clears the entity manager.
            - { name: kernel.event_listener, event: Symfony\Component\Messenger\Event\WorkerMessageHandledEvent, method: onMessageHandled, priority: 10 }
            - { name: kernel.event_listener, event: Symfony\Component\Messenger\Event\WorkerMessageFailedEvent, method: onMessageFailed }

    Alma\Sylius\EventListener\OrderInformationTransitionListener:
        tags:
            - { name: kernel.event_listener, event: 'workflow.sylius_order.completed', method: onOrderTransition }
            - { name: kernel.event_listener, event: 'workflow.sylius_order_shipping.completed', method: onOrderShippingTransition }
            - { name: kernel.event_listener, event: 'workflow.sylius_shipment.completed.ship', method: onShipmentShipped }

    Alma\Sylius\BusinessEvents\:
        resource: '../src/BusinessEvents/'

    Alma\Sylius\Repository\AlmaBusinessEventRepository:
        tags: [doctrine.repository_service]

    # After Sylius' own listener (priority 0), which adds the item to the cart.
    Alma\Sylius\BusinessEvents\CartItemAddListener:
        tags:
            - { name: kernel.event_listener, event: sylius.cart_item_add, method: onCartItemAdd, priority: -10 }

    Alma\Sylius\BusinessEvents\OrderPaidListener:
        tags:
            - { name: kernel.event_listener, event: 'workflow.sylius_order_payment.completed.pay', method: onOrderPaid }

    Alma\Sylius\Validator\Constraint\UniqueAlmaPaymentMethodValidator:
        arguments:
            $paymentMethodRepository: '@sylius.repository.payment_method'
        tags:
            - { name: validator.constraint_validator }

    Alma\Sylius\CmsDataExport\:
        resource: '../src/CmsDataExport/'

    Alma\Sylius\CmsDataExport\CmsFeaturesProvider:
        arguments:
            $paymentMethodRepository: '@sylius.repository.payment_method'
            $channelRepository: '@sylius.repository.channel'
            $taxonRepository: '@sylius.repository.taxon'

    Alma\Sylius\Controller\CmsDataExport\CmsDataExportController:
        public: true
        arguments:
            $paymentMethodRepository: '@sylius.repository.payment_method'
        tags: ['controller.service_arguments']

    Alma\Sylius\EventListener\CmsDataExportDeclarationListener:
        tags:
            - { name: kernel.event_listener, event: sylius.payment_method.post_create }
            - { name: kernel.event_listener, event: sylius.payment_method.post_update }

    Alma\Sylius\Factory\AlmaPaymentMethodFactory:
        decorates: sylius.custom_factory.payment_method
        arguments: ['@.inner']
